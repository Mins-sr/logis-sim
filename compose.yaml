services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slapstack}
      POSTGRES_USER: ${POSTGRES_USER:-slapstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slapstack-local-only}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slapstack}:${POSTGRES_PASSWORD:-slapstack-local-only}@db:5432/${POSTGRES_DB:-slapstack}
      OPTIMIZER_URL: http://optimizer:8001
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/ready\")'"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: python -m worker.main
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slapstack}:${POSTGRES_PASSWORD:-slapstack-local-only}@db:5432/${POSTGRES_DB:-slapstack}
      OPTIMIZER_URL: http://optimizer:8001
    depends_on:
      api:
        condition: service_healthy
      optimizer:
        condition: service_healthy

  optimizer:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: uvicorn optimizer.main:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slapstack}:${POSTGRES_PASSWORD:-slapstack-local-only}@db:5432/${POSTGRES_DB:-slapstack}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health/ready\")'"]
      interval: 3s
      timeout: 3s
      retries: 20

  proxy:
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    ports:
      - "${PROXY_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      optimizer:
        condition: service_healthy

volumes:
  pg_data:
  tls_certs:
